baseURL = "https://ronihcohen.github.io/northstar-financial/"
locale = "en-US"
title = "Northstar Financial"
publishDir = "dist"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term", "RSS"]

[params]
  description = "Financial research on businesses, markets, valuation, and investment risk."

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false

[minify]
  minifyOutput = true
